services:
  db:
    image: postgres:14.1-alpine
    container_name: college_db
    restart: always
    environment:
      - POSTGRES_DB=mycollegeDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5433:5432'
    volumes: 
      - db:/var/lib/postgresql/data
    
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: college_db_admin
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dadmin.com
      PGADMIN_DEFAULT_PASSWORD: admin  #host name : host.docker.internal
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    

volumes:
  db:
    driver: local
  pgadmin-data: {}
  postgres-data: {}