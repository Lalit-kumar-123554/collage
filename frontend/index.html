<html>

<head>
    <title>Starting React App</title>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            display: flex;
            background-color: #f4f4f4;
            
        }

        #login {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 300px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);

            position: relative;
            left: 250%;
            top: 200px;
        }

        input {
            padding: 10px;
            font-size: 17px;
            width: 100%;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            font-size: 14px;
        }

        #upload-container {

            margin-top: 10px;
            text-align: center;
             position: relative;
            left: 250%;
            top: 200px;
             width: 300px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);


        }

        .submit-button {
            margin-top: 20px;
            padding: 10px 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #45a049;
        }

        .preview-container {
            margin-top: 20px;
        }

        /* #upload-container{
                position:relative;
               left:200%;
               top:200px;
            } */

        img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
       
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
   
       
    <div id="root"></div>
    <script src="index.js" type="text/babel">

    </script>
</body>
